[package]
name = "fakeprint-python"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Python bindings for fakeprint: run the fake WSD printer in-process"
repository = "https://github.com/b1tninja/fakeprint-python"
rust-version = "1.94"

[lib]
name = "fakeprint_python"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py310"] }
# fakeprint exposes a library target (crates/fakeprint/src/lib.rs). Read-only dependency: this repo
# never edits it; what the library lacks is listed in docs/needs-from-rust.md.
fakeprint = { path = "../fakeprint/crates/fakeprint" }
anyhow = "1"
tower = { version = "0.5", features = ["util"] }
axum = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
