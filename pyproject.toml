[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "fakeprint"
version = "0.1.0"
description = "Python bindings for fakeprint: an in-process fake WS-Print printer, control client, SOAP client and schema tooling"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
keywords = ["printer", "wsd", "ws-print", "testing", "fakeprint"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Testing",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# fakeprint.winprint is stdlib-only (ctypes); this extra only names the Windows-only feature.
windows = []
mcp = ["mcp>=1.0"]
dev = ["pytest>=8", "maturin>=1.7,<2"]

[project.scripts]
fakeprint-refs = "fakeprint.wsd_docs:main"
fakeprint-ctl = "fakeprint.ctl:main"
fakeprint-lab = "fakeprint.lab:main"
fakeprint-mcp = "fakeprint.mcp_server:main"

[project.urls]
Homepage = "https://github.com/b1tninja/fakeprint-python"
Repository = "https://github.com/b1tninja/fakeprint-python"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "fakeprint._native"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets `pytest` run straight from a checkout without `pip install -e .`; the native tests need `maturin develop`.
pythonpath = ["python"]
markers = [
  "package: needs the extracted Microsoft WS-Print package (skipped when absent)",
  "winprint_live: needs FAKEPRINT_WIN_PRINTER (a human-installed printer whose WSD UUID is in the fake namespace); skipped otherwise",
  "embedded: runs the fakeprint server in-process through the native binding",
]
